<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Website</title>
  <link rel="icon" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content" data-i18n="skip">Skip to content</a>
  <header class="site-header" data-site-content hidden>
    <div class="contact-bar wrap">
      <a data-phone></a>
      <div id="account-navigation" class="account-navigation" hidden></div>
      <div class="social-links"></div>
    </div>
    <nav class="main-nav wrap" aria-label="Navigation" id="navigation">
      <div class="nav-side">
        <a href="/?page=home" data-page="home" data-i18n="home">Home</a>
        <a href="/?page=menu" data-page="menu" data-i18n="menu">Services</a>
      </div>
      <a class="brand" href="/" data-page="home"><img alt="" width="116" height="116" hidden></a>
      <div class="nav-side">
        <a href="/?page=training" data-page="training" data-i18n="training">Training</a>
        <a href="/?page=about" data-page="about" data-i18n="about">About</a>
        <span id="language-switch"></span>
      </div>
    </nav>
  </header>
  <main id="content" tabindex="-1">
    <section class="hero" id="hero" aria-labelledby="hero-title" data-site-content hidden>
      <div class="hero-content wrap">
        <p class="eyebrow" id="hero-eyebrow" hidden></p>
        <h1 id="hero-title"></h1>
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <div class="hero-actions" id="hero-actions">
          <a class="button button-light" href="/?page=menu" data-page="menu" data-i18n="menu">Services</a>
          <a class="button button-light" href="/?page=booking" data-booking data-i18n="book">Book an appointment</a>
          <a class="button button-light" href="/?page=vouchers" data-page="vouchers" data-i18n="vouchers">Gift vouchers</a>
          <a class="button button-light" href="/?page=training" data-page="training" data-i18n="course">Courses</a>
        </div>
      </div>
    </section>
    <p class="wrap" id="loading-message" role="status">Loading content…</p>
    <div class="error-message wrap" id="load-error" role="alert" hidden>
      <p id="error-text">We could not load the content. Please try again.</p>
      <button class="button" id="retry" type="button">Try again</button>
    </div>
    <div id="page-content"></div>
    <noscript><p class="wrap">Enable JavaScript to load the website content and contact details.</p></noscript>
  </main>
  <footer class="site-footer" data-site-content hidden>
    <div class="wrap centered">
      <p class="eyebrow" data-i18n="professional"></p>
      <h2 data-i18n="shortBrand"></h2>
      <p data-i18n="motto"></p>
      <div class="footer-links">
        <a href="/profile" id="account-link" hidden>My profile</a>
        <a href="/?page=menu" data-page="menu" data-i18n="menu">Services</a>
        <a href="/?page=booking" data-page="booking" data-i18n="book">Book an appointment</a>
        <a href="/?page=vouchers" data-page="vouchers" data-i18n="vouchers">Gift vouchers</a>
        <a href="/?page=training" data-page="training" data-i18n="training">Training</a>
        <a href="/?page=about" data-page="about" data-i18n="about">About</a>
      </div>
      <a data-phone></a>
      <p class="copyright" id="copyright"></p>
    </div>
  </footer>
  <dialog id="login-dialog"></dialog>
</body>
</html>
